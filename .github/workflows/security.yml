name: Security Pipeline

on:
  push:
    # Проверяем пуши во все ветки
    branches: [ "**" ]
  pull_request:
    # Также проверять PR перед слиянием
    types: [opened, synchronize, reopened]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем историю, чтобы Git мог сравнить коммиты

      - name: Test GitHub Actions
        run: |
          echo "Security pipeline started"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # event.before содержит хэш до пуша. Мы проверяем изменения от него до текущего HEAD.
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --results=verified,unknown

      #- name: Check Gitleaks config
      #  run: |
      #    echo "Config file:"
      #    ls -l raw_logs/syslog.txt

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Run OWASP Dependency-Check
        # Модуль отключен - false, true - включен
        if: false
        uses: dependency-check/Dependency-Check_Action@main
        id: DependencyCheck
        with:
          project: 'AI-SEC-PLATFORM'
          path: '.'
          # Выходной формат файла
          format: 'SARIF,HTML'
          # --enableRetired - поиск устаревших библиотек JS
          # --failOnCVSS 3 - пайплайн упадет если CVSS >= 3.0
          # --enableHighRiskIndex - высокорискованные методы анализа
          # NVD_API_KEY - ключ качает инфу об уязвимостях
          args: >
            --failOnCVSS 3
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Trivy SCA
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "json"
          output: "trivy.json"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"

      - name: Upload Trivy result
        uses: actions/upload-artifact@v4
        with:
          name: trivy-result
          path: trivy.json

  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Cache Semgrep rules
        id: semgrep-cache
        uses: actions/cache@v4
        with:
          path: .semgrep-rules
          key: semgrep-rules-v1

      - name: Download Semgrep rules
        if: steps.semgrep-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/semgrep/semgrep-rules.git .semgrep-rules
          rm -rf .semgrep-rules/stats
          rm LICENSE
          rm Pip*
          rm Makefile
          rm CO*
          rm metadata*
          rm README.m
          rm template*
          rm SECURITY.md

      - name: Run Semgrep
        run: |
          semgrep scan --config .semgrep-rules . --json --output semgrep.json

      - name: Upload Semgrep result
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-result
          path: semgrep.json







  gate:
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Trivy result
        uses: actions/download-artifact@v5
        with:
          name: trivy-result

      - name: Security gate
        run: python security/security_gate.py

